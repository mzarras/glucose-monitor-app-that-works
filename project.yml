# XcodeGen spec (HANDOFF §4.1). Generate with `xcodegen generate`; Sensor.xcodeproj is gitignored.
# Ownership: the orchestrator owns this file. Workstreams request changes in their report rather
# than editing it, except where their dispatch brief says otherwise.
name: Sensor

options:
  bundleIdPrefix: com.mzarras
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    TARGETED_DEVICE_FAMILY: "1"

packages:
  GlucoseCore:
    path: Packages/GlucoseCore
  G7Kit:
    path: Packages/G7Kit
  GlucoseStore:
    path: Packages/GlucoseStore
  GlucoseStats:
    path: Packages/GlucoseStats
  AlertEngine:
    path: Packages/AlertEngine
  TrioBridge:
    path: Packages/TrioBridge
  NightscoutKit:
    path: Packages/NightscoutKit
  ReplayKit:
    path: Packages/ReplayKit
  WidgetCore:
    path: Packages/WidgetCore

targets:
  Sensor:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      # Flat copy into the bundle root: UNNotificationSound needs sounds there, UIAppFonts
      # lists fonts by file name. Keep file names unique across both folders.
      - path: Resources/Fonts
        buildPhase: resources
        excludes: ["**/.gitkeep", "**/README.md"]
      - path: Resources/Sounds
        buildPhase: resources
        excludes: ["**/.gitkeep", "**/README.md"]
    settings:
      base:
        PRODUCT_NAME: Sensor
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(SENSOR_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SensorWidgets
      - package: GlucoseCore
      - package: G7Kit
      - package: GlucoseStore
      - package: GlucoseStats
      - package: AlertEngine
      - package: TrioBridge
      - package: NightscoutKit
      # Linked in every configuration, but every ReplayKit source is inside `#if DEBUG`, so the
      # Release binary contains no replay code (S6). scripts/check.sh verifies with nm.
      - package: ReplayKit
      - package: WidgetCore

  SensorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
      - path: Resources/Fonts
        buildPhase: resources
        excludes: ["**/.gitkeep", "**/README.md"]
    settings:
      base:
        PRODUCT_NAME: SensorWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/SensorWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: GlucoseCore
      - package: WidgetCore

  SensorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Sensor

  SensorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sensor
    dependencies:
      - target: Sensor

schemes:
  Sensor:
    build:
      targets:
        Sensor: all
        SensorWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      # Off: package coverage is measured by `swift test` in scripts/check.sh; enabling it here made
      # xcodebuild instrument Release builds of the scheme too (Phase 2 review m7).
      gatherCoverageData: false
      targets:
        - SensorTests
        - SensorUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
